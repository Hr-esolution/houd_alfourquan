<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a5c38" stroke="#4CAF50" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="85" fill="#2d2d2d" stroke="#666" stroke-width="2"/>
  
  <!-- Direction markers -->
  <text x="100" y="35" text-anchor="middle" fill="#4CAF50" font-size="20" font-weight="bold" font-family="Arial">N</text>
  <text x="170" y="105" text-anchor="middle" fill="#888" font-size="16" font-family="Arial">E</text>
  <text x="100" y="180" text-anchor="middle" fill="#888" font-size="16" font-family="Arial">S</text>
  <text x="30" y="105" text-anchor="middle" fill="#888" font-size="16" font-family="Arial">W</text>
  
  <!-- Degree markers -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Center point -->
  <circle cx="100" cy="100" r="5" fill="#4CAF50"/>
  <circle cx="100" cy="100" r="3" fill="#fff"/>
  
  <!-- Kaaba symbol at center -->
  <rect x="92" y="92" width="16" height="16" fill="#1a5c38" stroke="#FFD700" stroke-width="1.5"/>
</svg>
